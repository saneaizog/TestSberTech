openapi: 3.0.0
info:
  title: Photo Catalog API
  version: 1.0.0
  description: API для управления каталогом фотографий пользователей.
  contact:
    name: SberTech Team
    email: support@sbertech.ru
servers:
  - url: http://localhost:3000
tags:
  - name: users
    description: "Всё, связанное с пользователями"
  - name: photo
    description: "Все, связанное с фотографиями"
  - name: auth
    description: "Все, связанное с регистрацией и авторизацией"
  - name: likes
    description: "Все, связанное с лайками" 
  - name: friends
    description: "Все, связанное с друзьями"
paths:
  /api/v1/auth/register:
    post:
      tags:
        - auth
      summary: Регистрация пользователя
      description: Регистрация нового пользователя в системе
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  maxLength: 20
                  minLength: 4
                email:
                  type: string
                  example: "example@mail.ru"
                password:
                  type: string
                  description: Пароль должен содержать минимум 8 символов, включая строчные и прописные буквы, цифры и специальные символы.
                  minLength: 8
                  pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[!@#\\$%\\^&\\*])[A-Za-z\\d!@#\\$%\\^&\\*]{8,}$"
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
        '400':
          description: Ошибка валидации данных

  /api/v1/auth/login:
    post:
      tags:
        - auth      
      summary: Авторизация пользователя
      description: Авторизация пользователя по логину и паролю
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Успешная авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Неверные учетные данные

  /api/v1/auth/oauth/keycloak/url:
    post:
      tags:
        - auth
      summary: Получить URL для OAuth2 авторизации через Keycloak
      description: Генерирует URL для редиректа на Keycloak OAuth2
      operationId: getKeycloakUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_uri:
                  type: string
                  description: URL для возврата после авторизации
      responses:
        '200':
          description: URL для редиректа получен
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorization_url:
                    type: string
                    description: URL для редиректа на Keycloak

  /api/v1/auth/oauth/keycloak/callback:
    post:
      tags:
        - auth
      summary: Обработка callback от Keycloak OAuth2
      description: Обрабатывает callback от Keycloak и возвращает JWT токены
      operationId: keycloakCallback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Authorization code от Keycloak
                state:
                  type: string
                  description: State параметр для CSRF защиты
      responses:
        '200':
          description: Успешная авторизация через Keycloak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Неверный код авторизации
        '401':
          description: Ошибка авторизации в Keycloak

  /api/v1/auth/magic-link:
    post:
      tags:
        - auth
      summary: Запрос Magic Link для входа без пароля
      description: Отправляет Magic Link на указанный email
      operationId: requestMagicLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Email для отправки Magic Link
      responses:
        '200':
          description: Magic Link отправлен на email
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Magic Link отправлен на указанный email"
                  expires_in:
                    type: integer
                    description: Время жизни ссылки в секундах
                    example: 300
        '400':
          description: Неверный формат email
        '429':
          description: Слишком много запросов

  /api/v1/auth/magic-link/verify:
    post:
      tags:
        - auth
      summary: Верификация Magic Link кода
      description: Проверяет 6-значный код из email и авторизует пользователя
      operationId: verifyMagicLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                  description: 6-значный код из email
      responses:
        '200':
          description: Успешная верификация Magic Link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Неверный код или email
        '401':
          description: Срок действия кода истек
        '429':
          description: Превышено количество попыток

  /api/v1/auth/refresh:
    post:
      tags:
        - auth
      summary: Обновление access токена через refresh токен
      description: Обновляет access токен с помощью refresh токена
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Refresh токен
      responses:
        '200':
          description: Токен успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Неверный или просроченный refresh токен

  /api/v1/auth/logout:
    post:
      tags:
        - auth
      summary: Выход из системы (текущее устройство)
      description: Выход пользователя из системы на текущем устройстве
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Refresh токен для инвалидации
      responses:
        '200':
          description: Успешный выход
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Вы успешно вышли из системы"

  /api/v1/auth/logout-all:
    delete:
      tags:
        - auth
      summary: Выход из системы на всех устройствах
      description: Выход пользователя из системы на всех устройствах
      operationId: logoutAll
      responses:
        '200':
          description: Успешный выход на всех устройствах
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Вы успешно вышли из системы на всех устройствах"

  /api/v1/auth/me:
    get:
      tags:
        - auth
      summary: Получение информации о текущем пользователе
      description: Возвращает профиль текущего авторизованного пользователя
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Информация о пользователе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Пользователь не авторизован

  /api/v1/auth/2fa/enable:
    post:
      tags:
        - auth
      summary: Включение двухфакторной аутентификации
      description: Включает 2FA для пользователя и генерирует QR код
      operationId: enable2FA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Текущий пароль для подтверждения
      responses:
        '200':
          description: 2FA успешно включена
          content:
            application/json:
              schema:
                type: object
                properties:
                  qr_code:
                    type: string
                    description: Base64 encoded QR code
                  backup_codes:
                    type: array
                    items:
                      type: string
                    description: Резервные коды
        '400':
          description: Неверный пароль

  /api/v1/auth/2fa/disable:
    post:
      tags:
        - auth
      summary: Отключение двухфакторной аутентификации
      description: Отключает 2FA для пользователя
      operationId: disable2FA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                totp_code:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        '200':
          description: 2FA успешно отключена
        '400':
          description: Неверный пароль или TOTP код

  /api/v1/auth/oauth/accounts:
    get:
      tags:
        - auth
      summary: Получение списка привязанных OAuth2 аккаунтов
      description: Возвращает список всех привязанных OAuth2 аккаунтов пользователя
      operationId: getOAuthAccounts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список привязанных аккаунтов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OAuthAccount'

  /api/v1/auth/oauth/link:
    post:
      tags:
        - auth
      summary: Привязка OAuth2 аккаунта к текущему профилю
      description: Привязывает OAuth2 аккаунт к текущему профилю пользователя
      operationId: linkOAuthAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum: [keycloak]
                authorization_code:
                  type: string
      responses:
        '200':
          description: Аккаунт успешно привязан
        '400':
          description: Ошибка привязки аккаунта

  /api/v1/auth/oauth/unlink:
    delete:
      tags:
        - auth
      summary: Отвязка OAuth2 аккаунта
      description: Отвязывает OAuth2 аккаунт от профиля пользователя
      operationId: unlinkOAuthAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum: [keycloak]
                provider_user_id:
                  type: string
      responses:
        '200':
          description: Аккаунт успешно отвязан
        '400':
          description: Нельзя отвязать единственный способ входа

  /api/v1/users:
    get:
      tags:
        - users    
      summary: Получение всех пользователей
      operationId: getAllUsers
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /api/v1/users/{userId}:
    get:
      tags:
        - users  
      summary: Получение пользователя по ID
      operationId: getUserById
      parameters:
        - name: userId
          description: "Идентификатор пользователя"
          schema:
            type: string
          in: path
          required: true
          example: "4:15a90cb6-19b0-46f4-67dd-271556777f24:1746"
      responses:
        '200':
          description: Информация о пользователе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Пользователь не найден
    patch:
      tags:
        - users 
      summary: Обновить данные пользователя
      operationId: updateUser
      parameters:
        - name: userId
          description: "Идентификатор пользователя"
          schema:
            type: string
          in: path
          required: true
          example: "4:15a90cb6-19b0-46f4-67dd-271556777f24:1746"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Профиль обновлен
        '400':
          description: Ошибка валидации данных

  /api/v1/photos:
    post:
      tags:
        - photo
      summary: Загрузить новую фотографию
      operationId: uploadPhoto
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                caption:
                  type: string
                  maxLength: 1000
                location:
                  type: string
      responses:
        '201':
          description: Фотография успешно загружена
        '400':
          description: Ошибка валидации данных

  /api/v1/photos/{photoId}:
    get:
      tags:
        - photo
      summary: Получить информацию о фотографии
      operationId: getPhoto
      parameters:
        - name: photoId
          description: "Идентификатор фотографии"
          schema:
            type: string
          in: path
          required: true
          example: "4:15a90cb6-19b0-46f4-67dd-271556777f24:1746"
      responses:
        '200':
          description: Фотография успешно получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
        '404':
          description: Фотография не найдена
    put:
      tags:
        - photo
      summary: Обновить фотографию
      operationId: updatePhoto
      parameters:
        - name: photoId
          description: "Идентификатор фотографии"
          schema:
            type: string
          in: path
          required: true
          example: "4:15a90cb6-19b0-46f4-67dd-271556777f24:1746"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoUpdate'
      responses:
        '200':
          description: Фотография успешно обновлена
        '404':
          description: Фотография не найдена
    delete:
      tags:
        - photo
      summary: Удалить фотографию
      operationId: deletePhoto
      parameters:
        - name: photoId
          description: "Идентификатор фотографии"
          schema:
            type: string
          in: path
          required: true
          example: "4:15a90cb6-19b0-46f4-67dd-271556777f24:1746"
      responses:
        '204':
          description: Фотография успешно удалена
        '404':
          description: Фотография не найдена

  /api/v1/likes:
    post:
      tags:
        - likes
      summary: Лайкнуть фотографию (доступно только для фотографий друзей)
      operationId: likePhoto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photoId:
                  type: integer
      responses:
        '201':
          description: Фотография успешно лайкнута
        '400':
          description: Ошибка невозможно лайкнуть свою фотографию или не из списка друзей
    delete:
      tags:
        - likes
      summary: Убрать лайк (доступно только для фотографий друзей)
      operationId: unlikePhoto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photoId:
                  type: integer
      responses:
        '204':
          description: Лайк успешно убран
        '400':
          description: Ошибка невозможно убрать лайк с фотографии не из списка друзей
  /api/v1/likes/{photoId}:
    get:
      tags:
        - likes    
      summary: Получение всех пользователей, лайкнувших фотографию
      operationId: getPhotoLikes
      parameters:
        - name: photoId
          description: "Идентификатор фотографии"
          schema:
            type: string
          in: path
          required: true
          example: "4:15a90cb6-19b0-46f4-67dd-271556777f24:1746"
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /api/v1/friends:
    get:
      tags:
        - friends
      summary: Получить список друзей текущего пользователя
      description: Возвращает список друзей текущего авторизованного пользователя
      operationId: getFriends
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Номер страницы (по умолчанию 1)
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          description: Количество друзей на странице (по умолчанию 10)
          schema:
            type: integer
            default: 10
            minimum: 1
      responses:
        '200':
          description: Успешное получение списка друзей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Пользователь не авторизован
    post:
      tags:
        - friends
      summary: Добавить друга
      operationId: addFriend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                friendId:
                  type: integer
                  description: Идентификатор пользователя, которого нужно добавить в друзья
      responses:
        '201':
          description: Друг успешно добавлен
        '404':
          description: Пользователь не найден
        '400':
          description: Невозможно добавить друга (возможно, уже в друзьях)

  /api/v1/friends/{friendId}:
    delete:
      tags:
        - friends
      summary: Удалить друга
      operationId: removeFriend
      parameters:
        - name: friendId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Друг успешно удален
        '404':
          description: Пользователь или друг не найден

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string

    UserUpdate:
      type: object
      properties:
        username:
          type: string
        email:
          type: string

    PhotoUpdate:
      type: object
      properties:
        caption:
          type: string
        location:
          type: string     

    Photo:
      type: object
      properties:
        photoId:
          type: string
        description:
          type: string
        location:
          type: object
          properties:
            latitude:
              type: number
              format: float
            longitude:
              type: number
              format: float

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access токен
        refresh_token:
          type: string
          description: Refresh токен
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          description: Время жизни access токена в секундах
          example: 900
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        avatar_url:
          type: string
          format: uri
        totp_enabled:
          type: boolean
        last_login:
          type: string
          format: date-time
        login_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OAuthAccount:
      type: object
      properties:
        id:
          type: integer
        provider:
          type: string
          enum: [keycloak]
        realm:
          type: string
          example: "sberTech"
        provider_user_id:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time